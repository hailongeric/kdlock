# Reviewed kdmm1 experiments. Normal default stays in unchanged grub.cfg.

menuentry 'KDLock Linux 7 MM native' --id 'kdmm1-native-20261027' {
	recordfail
	load_video
	set gfxpayload=$linux_gfx_mode
	insmod gzio
	if [ x$grub_platform = xxen ]; then insmod xzio; insmod lzopio; fi
	insmod part_gpt
	insmod ext2
	set root='hd0,gpt1'
	if [ x$feature_platform_search_hint = xy ]; then
	  search --no-floppy --fs-uuid --set=root --hint-bios=hd0,gpt1 --hint-efi=hd0,gpt1 --hint-baremetal=ahci0,gpt1  aa0bde06-47f6-4049-aaaf-13d052e53961
	else
	  search --no-floppy --fs-uuid --set=root aa0bde06-47f6-4049-aaaf-13d052e53961
	fi
	echo	'Loading Linux 7.0.0-38-kdmm1 ...'
	linux	/boot/vmlinuz-7.0.0-38-kdmm1 root=UUID=aa0bde06-47f6-4049-aaaf-13d052e53961 ro nokaslr nopvspin console=tty1 console=ttyS0 preempt=lazy kd_mmap=off
	echo	'Loading initial ramdisk ...'
	initrd	/boot/initrd.img-7.0.0-38-kdmm1
}

