# Use native qspinlocks for the pinned KDLock VM.
# Append to the common command line without replacing console/mitigation options.
case " ${GRUB_CMDLINE_LINUX:-} ${GRUB_CMDLINE_LINUX_DEFAULT:-} " in
    *" nopvspin "*) ;;
    *) GRUB_CMDLINE_LINUX="${GRUB_CMDLINE_LINUX:-} nopvspin" ;;
esac

# Keep the verified KD clobber kernel selected across future boots.
GRUB_DEFAULT="gnulinux-advanced-aa0bde06-47f6-4049-aaaf-13d052e53961>gnulinux-6.1.159-kdclobber2-advanced-aa0bde06-47f6-4049-aaaf-13d052e53961"
